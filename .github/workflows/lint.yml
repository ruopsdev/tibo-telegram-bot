name: Lint

on:
  push:
    branches: [ master, main, 'feature/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check code formatting with black
      run: |
        black --check --diff telegram.py manage.py || true
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff telegram.py manage.py || true
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Critical errors only
        flake8 telegram.py manage.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # All errors as warnings
        flake8 telegram.py manage.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
